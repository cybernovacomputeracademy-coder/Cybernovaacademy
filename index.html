<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberNova - Under Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background glow */
        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.2) 0%, rgba(124, 58, 237, 0.2) 100%);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 1;
        }

        /* Glassmorphism Container */
        .card {
            position: relative;
            z-index: 2;
            max-width: 580px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px 35px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 229, 255, 0.08);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.25);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: #00e5ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00e5ff;
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 20%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .brand-name {
            color: #00e5ff;
            font-weight: 600;
        }

        .footer {
            font-size: 0.85rem;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="card">
        <div class="status-badge">
            <span class="pulse"></span>
            System Upgrades In Progress
        </div>

        <h1>We'll Be Back Soon</h1>

        <p>
            <span class="brand-name">CyberNova</span> is currently undergoing scheduled maintenance and updates to improve your experience. Thank you for your patience—we'll be back online shortly!
        </p>

        <div class="footer">
            &copy; CyberNova. All rights reserved.
        </div>
    </div>

</body>
</html>
